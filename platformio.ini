[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; === Custom partition for maximum program memory ===
; Uses optimized partition table
board_build.partitions = partitions.csv

; === Compilation optimizations ===
; Optimize for size and disable assertions
build_flags = 
    -Os
    -DNDEBUG

; === Memory configuration ===
board_build.extra_flags = 
    -DBOARD_HAS_PSRAM=0

; === Serial monitor and debug ===
monitor_filters = esp32_exception_decoder

; Uncomment for detailed debug logs (comment -DNDEBUG above):
; build_flags = -DCORE_DEBUG_LEVEL=3
