[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; === Particionamento para máxima memória de programa ===
; Usa partição customizada otimizada
board_build.partitions = partitions.csv

; === Otimizações de compilação ===
; Otimiza para tamanho e desativa asserts
build_flags = 
    -Os
    -DNDEBUG

; === Configurações de memória ===
board_build.extra_flags = 
    -DBOARD_HAS_PSRAM=0

; === Monitores e debug ===
monitor_filters = esp32_exception_decoder

; Descomente para logs detalhados (comentar -DNDEBUG acima):
; build_flags = -DCORE_DEBUG_LEVEL=3
